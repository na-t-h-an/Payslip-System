# --- Spring Config Import ---
# This pulls in your local secrets file.
spring.config.import=optional:classpath:application-secrets.properties

app.frontend.url=http://localhost:5173

# --- Database Connection (Logic) ---
# The URL and sensitive credentials are now in the secrets file
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- HikariCP Optimization ---
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=2

# --- JPA / Hibernate Logic ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20

# --- Google OAuth2 Registration (Structure) ---
# Scope is moved to secrets, IDs remain as placeholders for environment variables
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# --- JWT ---
app.jwt.secret=${JWT_SECRET}