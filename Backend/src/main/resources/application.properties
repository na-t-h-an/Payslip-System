# --- Spring Config Import (2026 Standard) ---
# This pulls in your local secrets file. The 'optional:file:' prefix 
# ensures it works even if the file is missing in CI/CD environments.
app.frontend.urls=http://localhost:5173,http://localhost:3000

spring.config.import=optional:classpath:application-secrets.properties

# --- Database Connection (Supabase) ---
spring.datasource.url=jdbc:postgresql://aws-1-ap-northeast-2.pooler.supabase.com:6543/postgres?prepareThreshold=0
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- HikariCP Optimization ---
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=2

# --- JPA / Hibernate Logic ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Spring Boot 4 optimization for PostgreSQL
spring.jpa.properties.hibernate.jdbc.batch_size=20

# --- Google OAuth2 Registration ---
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# Supabase JWT Config
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://prgkrjoapneskkzomkql.supabase.co/auth/v1
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://prgkrjoapneskkzomkql.supabase.co/auth/v1/.well-known/jwks.json
logging.level.org.springframework.security=DEBUG

# --- JWT ---
app.jwt.secret=${JWT_SECRET}

# --- Multipart (PDF upload) ---
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB